[package]
name = "rx-leptos"
version = "0.1.0"
edition = "2024"
description = "Bridges between rxRust observables and Leptos 0.8 signals"
license = "MIT"
repository = "https://github.com/rxRust/rxRust"
keywords = ["rx", "reactivex", "leptos", "signals", "frp"]
categories = ["asynchronous", "web-programming"]
publish = false

[dependencies]
any_spawner = "0.3"
reactive_graph = "0.2"
rxrust = {path = "../..", default-features = false, features = ["scheduler"]}
send_wrapper = "0.6"

[dev-dependencies]
any_spawner = {version = "0.3", features = ["futures-executor"]}

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = {version = "0.3", features = ["Event", "EventTarget"]}

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
