[package]
name = "leptos-ssr-example"
version = "0.1.0"
edition = "2024"
description = "Leptos 0.8 server-rendered + hydrated app showing rx-leptos bridges"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
any_spawner = {version = "0.3", features = ["tokio"], optional = true}
axum = {version = "0.8", optional = true}
console_error_panic_hook = "0.1"
leptos = "0.8"
leptos_axum = {version = "0.8", optional = true}
rx-leptos = {path = "../../crates/rx-leptos"}
rxrust = {path = "../.."}
tokio = {version = "1", features = ["rt-multi-thread", "macros", "time"], optional = true}
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = {version = "0.3", features = ["EventTarget", "HtmlElement", "MouseEvent"]}

[features]
hydrate = ["leptos/hydrate"]
ssr = ["dep:any_spawner", "dep:axum", "dep:leptos_axum", "dep:tokio", "leptos/ssr"]

[dev-dependencies]
any_spawner = {version = "0.3", features = ["tokio"]}
reactive_graph = "0.2"
tokio = {version = "1", features = ["rt", "rt-multi-thread", "macros", "time"]}

[package.metadata.leptos]
output-name = "leptos-ssr-example"
site-root = "target/site"
site-pkg-dir = "pkg"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
env = "DEV"
