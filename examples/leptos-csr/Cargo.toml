[package]
name = "leptos-csr-example"
version = "0.1.0"
edition = "2024"
description = "Leptos 0.8 client-side app showing rx-leptos bridges"
license = "MIT"
publish = false

[dependencies]
console_error_panic_hook = "0.1"
leptos = {version = "0.8", features = ["csr"]}
rx-leptos = {path = "../../crates/rx-leptos"}
rxrust = {path = "../.."}

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = {version = "0.3", features = ["Document", "EventTarget", "MouseEvent", "Window"]}

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
any_spawner = {version = "0.3", features = ["tokio"]}
reactive_graph = "0.2"
tokio = {version = "1", features = ["rt", "macros", "time"]}
